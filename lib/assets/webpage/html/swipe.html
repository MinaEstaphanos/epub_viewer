<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EPUB</title>
    <!-- <script src="http://code.jquery.com/jquery-2.1.4.min.js"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/detect_swipe/2.1.1/jquery.detect_swipe.min.js"></script> -->
    <script src="../dist/jszip.min.js"></script>
    <script src="../dist/epub.js"></script>

    <link rel="stylesheet" type="text/css" href="examples.css" />

    <style type="text/css">
      /*
        Fill the WebView, and keep filling it after it resizes. The reader's
        WebView starts at the full screen height, then shrinks when the app's
        bottom bar appears. The old rules centered the viewer in a body whose
        height was left at that first, larger value, so a dead band was left at
        the bottom that clipped and covered the text as it scrolled. Pinning
        html/body/#viewer to height:100% (which tracks the live viewport) and
        dropping the flex-centering makes the viewer always fill the current
        height with no gap.
      */
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #viewer {
        width: 100%;
        height: 100%;
        margin: 0 auto;
        background: white;
      }

      /*
        Turn off the browser's native scroll anchoring in the scrolling
        container. In scrolled (continuous) mode, epub.js does its OWN scroll
        compensation when it inserts an earlier section above the viewport
        (see the view manager's counter()/scrollBy). Modern Chromium WebViews
        ALSO adjust the scroll position for content inserted above — so the
        two stack, and scrolling up into a not-yet-rendered section (e.g. the
        Introduction) jumps the view back down. Disabling native anchoring
        here leaves epub.js's compensation as the only adjustment.
      */
      html,
      body,
      #viewer,
      #viewer * {
        overflow-anchor: none;
      }

      @media only screen and (min-device-width: 320px) and (max-device-width: 667px) {
        .arrow {
          position: inherit;
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <script src="epubView.js"></script>
  </body>
</html>
